# Supabase CLI project configuration (used by `supabase link`, `supabase db push`
# and `supabase functions deploy`). See SETUP.md.
project_id = "pickup-orders"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Owners are created by `npm run owner:invite` with the service role.
# There is no public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MiB"

# Public endpoints verify the request themselves (rate limits, tokens,
# membership), so the gateway JWT check is not required.
[functions.public-api]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.ai-chat]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.notify-dispatch]
verify_jwt = false
import_map = "./functions/deno.json"
